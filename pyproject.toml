[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qualcomm-edge-ai-workshop"
version = "1.0.0"
description = "A hands-on workshop for deploying AI models on Qualcomm Snapdragon hardware using AI Hub, QAIRT, QNN, and GenieX."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Qualcomm Edge AI Workshop Contributors"}
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "qai-hub>=0.18.0",
    "qai-hub-models>=0.14.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "onnx>=1.14.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
geniex = [
    "geniex>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
